# Render Blueprint: New → Blueprint → select this repository.
# Creates PostgreSQL, Redis (Key Value), the API and the web front end on Render's private
# network. You are asked for the first admin password when the blueprint is applied.
databases:
  - name: examgrid-db
    plan: free
    databaseName: examgrid
    user: examgrid
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: examgrid-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: examgrid-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: EXAMGRID_DB_HOST
        fromDatabase: { name: examgrid-db, property: host }
      - key: EXAMGRID_DB_PORT
        fromDatabase: { name: examgrid-db, property: port }
      - key: EXAMGRID_DB_NAME
        fromDatabase: { name: examgrid-db, property: database }
      - key: EXAMGRID_DB_USERNAME
        fromDatabase: { name: examgrid-db, property: user }
      - key: EXAMGRID_DB_PASSWORD
        fromDatabase: { name: examgrid-db, property: password }
      - key: EXAMGRID_REDIS_URL
        fromService: { type: keyvalue, name: examgrid-redis, property: connectionString }
      - key: EXAMGRID_JWT_SECRET
        generateValue: true
      - key: EXAMGRID_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: EXAMGRID_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: EXAMGRID_DEMO_ENABLED
        value: "true"
      - key: EXAMGRID_SCHEDULING_WORKER_THREADS
        value: "1"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true -XX:TieredStopAtLevel=1

  - type: web
    name: examgrid-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /healthz
    envVars:
      - key: API_UPSTREAM
        fromService: { type: web, name: examgrid-api, property: hostport }
