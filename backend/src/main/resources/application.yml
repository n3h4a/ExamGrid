spring:
  application:
    name: examgrid
  datasource:
    url: ${EXAMGRID_DB_URL:jdbc:postgresql://localhost:5432/examgrid}
    username: ${EXAMGRID_DB_USERNAME:examgrid}
    password: ${EXAMGRID_DB_PASSWORD:examgrid}
    hikari:
      maximum-pool-size: ${EXAMGRID_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

examgrid:
  security:
    jwt-secret: ${EXAMGRID_JWT_SECRET:}
    issuer: examgrid
    token-ttl: ${EXAMGRID_TOKEN_TTL:8h}
    cors-origins: ${EXAMGRID_CORS_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    username: ${EXAMGRID_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${EXAMGRID_BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    root: ${EXAMGRID_STORAGE_ROOT:./data/storage}
  imports:
    roll-pattern: ${EXAMGRID_ROLL_PATTERN:}
  scheduling:
    worker-threads: ${EXAMGRID_SCHEDULING_WORKER_THREADS:2}
    max-active-runs: ${EXAMGRID_SCHEDULING_MAX_ACTIVE_RUNS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  pattern:
    correlation: '[%X{requestId:-}] '
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error
