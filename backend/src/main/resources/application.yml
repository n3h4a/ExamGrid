spring:
  application:
    name: examgrid
  datasource:
    # Either a full JDBC URL, or host/port/name parts (how PaaS providers expose a database).
    url: ${EXAMGRID_DB_URL:jdbc:postgresql://${EXAMGRID_DB_HOST:localhost}:${EXAMGRID_DB_PORT:5432}/${EXAMGRID_DB_NAME:examgrid}}
    username: ${EXAMGRID_DB_USERNAME:examgrid}
    password: ${EXAMGRID_DB_PASSWORD:examgrid}
    hikari:
      maximum-pool-size: ${EXAMGRID_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  flyway:
    enabled: true
  data:
    redis:
      url: ${EXAMGRID_REDIS_URL:redis://localhost:6379}
      # Redis is a cache: fail fast and let RedisCircuit route to the Postgres fallback.
      timeout: 500ms
      connect-timeout: 500ms
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

examgrid:
  security:
    jwt-secret: ${EXAMGRID_JWT_SECRET:}
    issuer: examgrid
    token-ttl: ${EXAMGRID_TOKEN_TTL:8h}
    cors-origins: ${EXAMGRID_CORS_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    username: ${EXAMGRID_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${EXAMGRID_BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    root: ${EXAMGRID_STORAGE_ROOT:./data/storage}
  imports:
    roll-pattern: ${EXAMGRID_ROLL_PATTERN:}
  publishing:
    required-approvals: ${EXAMGRID_REQUIRED_APPROVALS:2}
    institution-name: ${EXAMGRID_INSTITUTION_NAME:ExamGrid Demo University}
  rate-limit:
    enabled: ${EXAMGRID_RATE_LIMIT_ENABLED:true}
    public-per-minute: ${EXAMGRID_RATE_LIMIT_PUBLIC:60}
    login-per-minute: ${EXAMGRID_RATE_LIMIT_LOGIN:10}
  demo:
    enabled: ${EXAMGRID_DEMO_ENABLED:false}
  scheduling:
    worker-threads: ${EXAMGRID_SCHEDULING_WORKER_THREADS:2}
    max-active-runs: ${EXAMGRID_SCHEDULING_MAX_ACTIVE_RUNS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # Redis is a cache with a Postgres fallback, so it must not take the API out of rotation.
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  pattern:
    correlation: '[%X{requestId:-}] '
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error
