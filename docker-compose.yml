# Local infrastructure for development: PostgreSQL and Redis.
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=dev mvn -pl backend -am spring-boot:run
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examgrid
      POSTGRES_USER: examgrid
      POSTGRES_PASSWORD: examgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examgrid -d examgrid"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
