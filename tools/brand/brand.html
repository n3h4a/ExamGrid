<!doctype html>
<!--
  Source of the README banner and the GitHub social preview.
  Render with: node tools/brand/render.cjs   (writes docs/assets/banner.png and social-preview.png)
  ?card=banner (1280×360) or ?card=social (1280×640).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --navy-900: #10233b; --navy-700: #1f3a5f; --navy-500: #2f5c8f; --navy-100: #d6e2f0;
    --sky: #e0f2fe; --sky-ring: #7dd3fc; --amber: #fef3c7; --amber-ring: #fcd34d;
    --emerald: #d1fae5; --emerald-ring: #6ee7b7; --blocked: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, sans-serif; background: transparent; }
  .card {
    position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(120% 140% at 0% 0%, var(--navy-500) 0%, var(--navy-700) 38%, var(--navy-900) 100%);
  }
  .banner { width: 1280px; height: 360px; display: flex; align-items: center; padding: 0 72px; gap: 64px; }
  .social { width: 1280px; height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .mark { width: 84px; height: 84px; flex: none; }
  .social .mark { width: 80px; height: 80px; }
  .word { font-weight: 700; font-size: 64px; letter-spacing: -0.035em; line-height: 1; }
  .social .word { font-size: 68px; }
  .tagline { margin-top: 18px; font-size: 25px; line-height: 1.4; color: var(--navy-100); font-weight: 400; max-width: 700px; }
  .social .tagline { margin-top: 0; max-width: 1000px; font-size: 28px; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  .social .chips { margin-top: 0; justify-content: center; }
  .chip { font-size: 15px; font-weight: 500; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); color: #e6eef8; }
  .room { flex: none; padding: 18px 20px 20px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); }
  .front { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .18em; color: #9fb6d3; margin-bottom: 10px; }
  .grid { display: grid; gap: 6px; }
  .seat { width: 44px; height: 34px; border-radius: 7px; font: 600 10px/1 "JetBrains Mono", monospace; display: flex; align-items: center; justify-content: center; color: #0f172a; }
  .a { background: var(--sky); box-shadow: inset 0 0 0 1.5px var(--sky-ring); }
  .b { background: var(--amber); box-shadow: inset 0 0 0 1.5px var(--amber-ring); }
  .c { background: var(--emerald); box-shadow: inset 0 0 0 1.5px var(--emerald-ring); }
  .x { background: transparent; box-shadow: inset 0 0 0 1.5px var(--blocked); color: var(--blocked); }
  .legend { margin-top: 12px; display: flex; gap: 14px; justify-content: center; font-size: 12px; color: #c4d3e6; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<template id="mark">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".28" stroke-width=".6"/>
    <g fill="#fff"><rect x="7" y="7" width="7" height="7" rx="1.5"/><rect x="18" y="7" width="7" height="7" rx="1.5" opacity=".55"/><rect x="7" y="18" width="7" height="7" rx="1.5" opacity=".55"/><rect x="18" y="18" width="7" height="7" rx="1.5"/></g>
  </svg>
</template>
<script>
  const card = new URLSearchParams(location.search).get('card') || 'banner';
  const mark = document.getElementById('mark').innerHTML;
  // A room as ExamGrid seats it: papers alternate so no two neighbours share one; blocked seats stay empty.
  const rows = card === 'social' ? 4 : 5, cols = card === 'social' ? 8 : 6;
  const blocked = new Set(card === 'social' ? ['1:3', '2:6'] : ['2:2', '4:5']);
  let seats = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const label = String.fromCharCode(65 + r) + (c + 1);
    const cls = blocked.has(r + ':' + c) ? 'x' : (r + c) % 2 === 0 ? 'a' : (c % 4 === 1 ? 'c' : 'b');
    seats += `<div class="seat ${cls}">${cls === 'x' ? '×' : label}</div>`;
  }
  const room = `<div class="room"><div class="front">FRONT OF HALL</div>
    <div class="grid" style="grid-template-columns:repeat(${cols},44px)">${seats}</div>
    <div class="legend"><span><i class="dot a"></i>CS301</span><span><i class="dot b"></i>MA201</span><span><i class="dot c"></i>PH101</span><span><i class="dot x"></i>blocked</span></div></div>`;
  const algorithms = ['DSatur colouring', 'Simulated annealing', 'Min-cost flow', 'Seating CSP'];
  const chips = (card === 'social' ? [...algorithms, 'Spring Boot · React · Postgres · Redis'] : algorithms)
    .map((t) => `<span class="chip">${t}</span>`).join('');
  const tagline = card === 'social'
    ? 'Exam timetables, seating plans and invigilation rosters<br>for a whole university, planned in under a second.'
    : 'Exam timetables, seating plans and invigilation rosters for a whole university, planned in under a second.';
  document.body.innerHTML = card === 'social'
    ? `<div class="card social" id="card"><div class="brand">${mark}<div class="word">ExamGrid</div></div>
         <p class="tagline">${tagline}</p>${room}<div class="chips">${chips}</div></div>`
    : `<div class="card banner" id="card"><div><div class="brand">${mark}<div class="word">ExamGrid</div></div>
         <p class="tagline">${tagline}</p><div class="chips">${chips}</div></div>${room}</div>`;
</script>
</body>
</html>
